[project]
name = "hei-fastapi-ddd"
version = "1.1.0-beta"
description = "常见六层工程模型的 FastAPI DDD 脚手架；对外契约与 hei-fastapi 对齐。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Charlie" }
]
dependencies = [
  "alembic>=1.16.0",
  "alibabacloud-dm20151123>=1.0.0",
  "alibabacloud-dysmsapi20170525>=1.0.0",
  "alibabacloud-tea-openapi>=0.3.0",
  "authlib>=1.3.0",
  "bcrypt>=5.0.0",
  "blinker>=1.9.0",
  "boto3>=1.39.0",
  "captcha>=0.7.0",
  "croniter>=3.0.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "greenlet>=3.2.0",
  "gunicorn>=23.0.0",
  "hvac>=2.4.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "opentelemetry-api>=1.36.0",
  "opentelemetry-exporter-otlp>=1.36.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0",
  "opentelemetry-instrumentation-httpx>=0.57b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
  "opentelemetry-sdk>=1.36.0",
  "orjson>=3.10.0",
  "oss2>=2.19.0",
  "prometheus-client>=0.22.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "redis>=6.2.0",
  "snowflake-id>=1.0.2",
  "sqlalchemy>=2.0.41",
  "structlog>=24.0.0",
  "tencentcloud-sdk-python-ses>=3.1.135",
  "tencentcloud-sdk-python-sms>=3.1.153",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
mysql = [
  "aiomysql>=0.2.0",
  "asyncmy>=0.2.10",
]
postgres = [
  "asyncpg>=0.30.0",
]
dev = [
  "aiomysql>=0.2.0",
  "asyncpg>=0.30.0",
  "bandit>=1.8.0",
  "jsonschema>=4.23.0",
  "mypy>=1.16.0",
  "pip-audit>=2.8.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[project.scripts]
hei-fastapi-ddd = "gunicorn.app.wsgiapp:run"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hei_fastapi_ddd*"]

[tool.setuptools.package-data]
"hei_fastapi_ddd.contexts.sys.application.codegen" = ["template_files/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
  "E501",
  "B008",
  "N818",  # DomainException 等为 DDD 惯用命名，不强制 Error 后缀
]

[tool.ruff.lint.per-file-ignores]
"src/hei_fastapi_ddd/contexts/biz/**" = ["N802", "N806"]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101", "B311"]
targets = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
mypy_path = "src"
